<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Остальное — Уютная Лавка Рыжкина</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        .top-header-block { display: flex; flex-direction: column; align-items: flex-start; padding: 30px 40px 10px 40px; width: 100%; box-sizing: border-box; }
        .breadcrumbs { font-size: 14px; color: #888888; font-weight: 500; margin-top: 10px; }
        .breadcrumbs a { color: #888888; text-decoration: none; transition: color 0.2s; }
        .breadcrumbs a:hover { color: #000000; }
        .breadcrumbs .current { color: #000000; font-weight: 600; }
        main { flex: 1; padding: 20px 40px 120px 40px; display: flex; flex-direction: column; align-items: flex-start; position: relative; }
        .quake-title {
            font-family: 'Press Start 2P', monospace; font-size: 36px; line-height: 1.3; color: #ffffff; text-transform: uppercase; user-select: none; margin: 0 0 30px 0; text-align: left; transform: skewX(-10deg); letter-spacing: -2px; display: inline-block;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -3px 3px 0 #000, -4px 4px 0 #000, -5px 5px 0 #000, -6px 6px 0 #000, -7px 7px 0 #000, -8px 8px 0 #000, -9px 9px 0 #000, -10px 10px 15px rgba(0,0,0,0.4);
            animation: quakePulse 2s infinite ease-in-out;
        }
        @keyframes quakePulse {
            0%, 100% { color: #ffffff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #000, -6px 6px 0 #000, -8px 8px 0 #000, -10px 10px 15px rgba(0,0,0,0.3); }
            50% { color: #e5e5e5; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -5px 5px 0 #333, -8px 8px 0 #111, -11px 11px 20px rgba(0,0,0,0.5); }
        }
        .content-body { width: 100%; max-width: 800px; text-align: left; font-size: 18px; line-height: 1.6; color: #333333; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .back-btn { position: fixed; bottom: 10px; left: 10px; margin: 0; padding: 10px; color: #000000; text-decoration: none; font-size: 14px; font-weight: 500; opacity: 0.5; transition: opacity 0.2s ease; z-index: 20; background: rgba(255,255,255,0.9); border-radius: 4px; }
        .back-btn:hover { opacity: 1; }
        @media (max-width: 768px) {
            .top-header-block { align-items: center; text-align: center; padding: 20px; }
            .breadcrumbs { text-align: center; font-size: 13px; }
            main { padding: 10px 20px 100px 20px; align-items: center; }
            .quake-title { font-size: 24px; letter-spacing: -1px; align-self: center; }
            .content-body { font-size: 16px; }
            .back-btn { width: calc(100% - 40px); left: 10px; right: 10px; text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        }
    </style>
</head>
<body>
    <div class="top-header-block">
        <h1 class="quake-title">Pro Остальное</h1>
        <div class="breadcrumbs">
            <a href="../../../">Уютная Лавка Рыжкина</a> — <a href="../../../vhodnaya-gruppa/">Входная группа</a> — <a href="../../">Алкоголь</a> — <span class="current">Pro Остальное</span>
        </div>
    </div>
    <main>
        <div class="content-body">
            <p>Территория крепких и благородных напитков: вино, виски, настойки, дистилляты, эстетика чистых вкусов и всё, что не вошло в рамки пива и коктейлей.</p>
        </div>
        <a href="../../" class="back-btn">← Вернуться к Алкоголю</a>
    </main>
</body>
</html>
