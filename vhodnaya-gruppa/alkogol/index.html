<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алкоголь — Уютная Лавка Рыжкина</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        
        /* Верхняя панель: Хлебные крошки справа */
        .top-bar { display: flex; justify-content: flex-end; padding: 30px 40px; }
        .breadcrumbs { font-size: 14px; color: #888888; font-weight: 500; }
        .breadcrumbs a { color: #888888; text-decoration: none; transition: color 0.2s; }
        .breadcrumbs a:hover { color: #000000; }
        .breadcrumbs .current { color: #000000; font-weight: 600; }

        /* Основной контент */
        main { flex: 1; padding: 20px 40px 100px 40px; position: relative; }
        
        /* СТИЛЬ ИЗ КУЛИНАРИИ: Монументальный заголовок сверху слева БЕЗ рамки */
        .quake-title {
            font-family: 'Press Start 2P', monospace; font-size: 36px; line-height: 1.3; color: #ffffff; text-transform: uppercase; user-select: none; margin: 0 0 40px 0; text-align: left; transform: skewX(-10deg); letter-spacing: -2px; display: inline-block;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -3px 3px 0 #000, -4px 4px 0 #000, -5px 5px 0 #000, -6px 6px 0 #000, -7px 7px 0 #000, -8px 8px 0 #000, -9px 9px 0 #000, -10px 10px 15px rgba(0,0,0,0.4);
            animation: quakePulse 2s infinite ease-in-out;
        }
        @keyframes quakePulse {
            0%, 100% { color: #ffffff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #000, -6px 6px 0 #000, -8px 8px 0 #000, -10px 10px 15px rgba(0,0,0,0.3); }
            50% { color: #e5e5e5; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -5px 5px 0 #333, -8px 8px 0 #111, -11px 11px 20px rgba(0,0,0,0.5); }
        }

        /* Текстовая зона в стиле Apple */
        .content-body { max-width: 800px; text-align: left; font-size: 18px; line-height: 1.6; color: #333333; margin-top: 20px; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Кнопка возврата снизу слева */
        .back-btn { position: fixed; bottom: 10px; left: 10px; margin: 0; padding: 10px; color: #000000; text-decoration: none; font-size: 14px; font-weight: 500; opacity: 0.5; transition: opacity 0.2s ease; z-index: 20; }
        .back-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="breadcrumbs">
            <a href="../../">Уютная Лавка Рыжкина</a> — 
            <a href="../../vhodnaya-gruppa/">Входная группа</a> — 
            <span class="current">Алкоголь</span>
        </div>
    </div>

    <main>
        <h1 class="quake-title">Алкоголь</h1>
        
        <div class="content-body">
            <!-- Место под культуру алкоголя и обзоры -->
            <p>Раздел, посвящённый культуре ответственного пития, честным обзорам на напитки, истории винокурения и барной эстетике.</p>
        </div>
        
        <a href="../../vhodnaya-gruppa/" class="back-btn">← Вернуться ко входной группе</a>
    </main>

</body>
</html>
