<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КОТИК-БЕГУН — Уютная Лавка Рыжкина</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        .top-header-block { display: flex; flex-direction: column; align-items: flex-start; padding: 30px 40px 10px 40px; width: 100%; box-sizing: border-box; }
        .breadcrumbs { font-size: 14px; color: #888888; font-weight: 500; margin-top: 10px; text-align: left; }
        .breadcrumbs a { color: #888888; text-decoration: none; }
        .breadcrumbs .current { color: #000000; font-weight: 600; }
        
        main { flex: 1; padding: 20px 40px 40px 40px; display: flex; flex-direction: column; gap: 30px; width: 100%; box-sizing: border-box; margin: 0 auto; align-items: center; }
        
        .quake-title {
            font-family: 'Press Start 2P', monospace; font-size: 28px; line-height: 1.3; color: #ffffff; text-transform: uppercase; user-select: none; margin: 0 0 10px 0; transform: skewX(-10deg); letter-spacing: -2px; display: inline-block;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #000, -6px 6px 0 #000, -8px 8px 0 #000, -10px 10px 15px rgba(0,0,0,0.3);
        }

        .game-area-wrapper { width: 100%; max-width: 1100px; display: flex; flex-direction: column; }
        
        .game-container {
            width: 100%; height: 350px; border: 4px solid #000000; position: relative; background: #fafafa; overflow: hidden; box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
        }

        #cat {
            width: 50px; height: 50px; font-size: 40px; line-height: 50px; text-align: center;
            position: absolute; bottom: 20px; left: 50px; z-index: 2; user-select: none;
        }
        .obstacle {
            width: 40px; height: 40px; font-size: 32px; line-height: 40px; text-align: center;
            position: absolute; bottom: 20px; right: -50px; z-index: 2; user-select: none;
        }
        .ground-line {
            position: absolute; bottom: 20px; left: 0; width: 100%; height: 4px; background: #000000; z-index: 1;
        }

        .game-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
        }
        .game-overlay h2 { font-family: 'Press Start 2P', monospace; font-size: 14px; text-transform: uppercase; margin-bottom: 20px; text-align: center; }
        
        .pixel-input {
            font-family: 'Press Start 2P', monospace; font-size: 11px; padding: 10px; border: 4px solid #000000; outline: none; margin-bottom: 20px; width: 80%; max-width: 300px; text-align: center; background: #ffffff;
        }
        
        .pixel-btn {
            background: #000000; color: #ffffff; border: 4px solid #000000; padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 10px; text-transform: uppercase; cursor: pointer; transition: transform 0.1s; margin: 5px;
        }
        .pixel-btn:hover { background: #ffffff; color: #000000; transform: skewX(-5deg); }

        .live-score { font-family: 'Press Start 2P', monospace; font-size: 14px; margin-bottom: 15px; text-align: left; align-self: flex-start; }

        .leaderboard-wrapper { width: 100%; max-width: 1100px; border: 4px solid #000000; background: #ffffff; padding: 25px 30px; box-sizing: border-box; margin-top: 20px; }
        .leaderboard-wrapper h2 { font-family: 'Press Start 2P', monospace; font-size: 12px; text-transform: uppercase; margin: 0 0 20px 0; text-align: center; border-bottom: 4px solid #000000; padding-bottom: 15px; }
        
        .leaderboard-list { list-style: none; padding: 0; margin: 0; font-family: 'Press Start 2P', monospace; font-size: 11px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px 30px; }
        .leaderboard-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #cccccc; padding: 6px 0; box-sizing: border-box; }
        .leaderboard-item .rank { color: #888888; margin-right: 5px; }

        .hidden { display: none !important; }

        /* ЖЕСТКИЙ ПЕРЕВОД В 16:9 НА МОБИЛКАХ ОТ КРАЯ ДО КРАЯ ЭкРАНА */
        @media (max-width: 768px) {
            .top-header-block { align-items: center; padding: 15px; }
            .breadcrumbs { text-align: center; font-size: 12px; }
            main { padding: 10px 10px 40px 10px; gap: 20px; }
            .game-area-wrapper { width: 100%; }
            
            /* Контейнер теперь железно встает в пропорцию 16:9 и растягивается на 100% ширины телефона */
            .game-container { width: 100%; height: auto; aspect-ratio: 16 / 9; }
            
            .leaderboard-wrapper { padding: 15px; }
            .leaderboard-list { grid-template-columns: 1fr; gap: 10px; }
            .pixel-btn { width: 100%; box-sizing: border-box; text-align: center; margin: 5px 0; font-size: 9px; padding: 10px; }
            .game-overlay h2 { font-size: 11px; margin-bottom: 10px; }
            .pixel-input { font-size: 10px; padding: 8px; margin-bottom: 10px; }
            
            #cat { width: 35px; height: 35px; font-size: 28px; line-height: 35px; left: 20px; bottom: 12px; }
            .obstacle { width: 28px; height: 28px; font-size: 22px; line-height: 28px; bottom: 12px; }
            .ground-line { bottom: 12px; }
        }
    </style>
</head>
<div class="top-header-block">
    <h1 class="quake-title">дворовй забег</h1>
    <div class="breadcrumbs">
        <a href="../../../">Уютная Лавка Рыжкина</a> — <a href="../../">Входная группа</a> — <a href="../">#котиксвашегодвора</a> — <span class="current">Поиграться</span>
    </div>
</div>

<main>
    <div class="game-area-wrapper">
        <div class="live-score">Счёт: <span id="scoreVal">0</span></div>
        
        <div class="game-container" id="gameContainer">
            <div id="cat">🐈</div>
            <div class="ground-line"></div>
            
            <div class="game-overlay" id="startScreen">
                <h2>Регистрация котика</h2>
                <input type="text" id="playerName" class="pixel-input" placeholder="ИМЯ КОТИКА" maxlength="15">
                <button class="pixel-btn" id="startBtn">СТАРТ</button>
            </div>

            <div class="game-overlay hidden" id="endScreen">
                <h2>БАМС! Препятствие!</h2>
                <p style="font-family:'Press Start 2P'; font-size:11px; margin-bottom:20px; text-align:center;">Ваш счёт: <span id="finalScore">0</span></p>
                <div style="display:flex; flex-direction:row; justify-content:center; width:100%; flex-wrap:wrap; max-width:500px;">
                    <button class="pixel-btn" id="saveOnlyBtn">СОХРАНИТЬ</button>
                    <button class="pixel-btn" id="saveAndRestartBtn">ЗАНОВО</button>
                </div>
            </div>
        </div>
        <p style="font-size: 13px; color: #666; margin-top: 10px; align-self: flex-start;">Управление: <b>Пробел</b>, стрелка <b>Вверх</b> или любой <b>Тап/Клик</b> по экрану игры.</p>
    </div>

    <div class="leaderboard-wrapper">
        <h2>ЛУЧШИЕ КОТИКИ ВАШЕГО ДВОРА</h2>
        <ul class="leaderboard-list" id="leaderboardList">
            <li style="color:#888; text-align:center; grid-column: 1 / -1;">Загрузка рекордов...</li>
        </ul>
    </div>
</main>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0uHScGaAJffoLBj9NQFSr7M7R-diN0pm5UwOX45dX_sbqI0bRdP9TR5jiCHQZDUrqtQ/exec";

    const cat = document.getElementById('cat');
    const gameContainer = document.getElementById('gameContainer');
    const scoreVal = document.getElementById('scoreVal');
    const finalScore = document.getElementById('finalScore');
    
    const startScreen = document.getElementById('startScreen');
    const endScreen = document.getElementById('endScreen');
    const startBtn = document.getElementById('startBtn');
    const saveOnlyBtn = document.getElementById('saveOnlyBtn');
    const saveAndRestartBtn = document.getElementById('saveAndRestartBtn');
    const playerNameInput = document.getElementById('playerName');
    const leaderboardList = document.getElementById('leaderboardList');

    let score = 0;
    let isJumping = false;
    let isPlaying = false;
    let obstacleTimeout;
    let currentObstacle = null;
    let playerName = "";

    function fetchLeaderboard() {
        const oldScript = document.getElementById('jsonp-leaderboard');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'jsonp-leaderboard';
        script.src = SCRIPT_URL + "?callback=renderLeaderboard&t=" + new Date().getTime();
        
        script.onerror = function() {
            leaderboardList.innerHTML = `<li style="color:#888; text-align:center; grid-column: 1 / -1;">Пока нет рекордов</li>`;
        };
        document.body.appendChild(script);
    }
    
    fetchLeaderboard();

    window.renderLeaderboard = function(data) {
        leaderboardList.innerHTML = "";
        const list = data.leaderboard;
        
        if (!list || list.length === 0) {
            leaderboardList.innerHTML = `<li style="color:#888; text-align:center; grid-column: 1 / -1;">Никто еще не бегал</li>`;
            return;
        }
        
        list.forEach((item, index) => {
            const currentName = item[0];
            const currentScore = parseInt(item[1]);
            
            if (currentScore > 0) {
                const li = document.createElement('li');
                li.className = 'leaderboard-item';
                li.innerHTML = `<div><span class="rank">#${index+1}</span> ${currentName}</div><div>${currentScore}</div>`;
                leaderboardList.appendChild(li);
            }
        });
        
        if (leaderboardList.innerHTML === "") {
            leaderboardList.innerHTML = `<li style="color:#888; text-align:center; grid-column: 1 / -1;">Никто еще не бегал</li>`;
        }
    };

    function jump() {
        if (isJumping || !isPlaying) return;
        isJumping = true;
        
        const isMobile = window.innerWidth <= 768;
        const currentGroundPos = isMobile ? 12 : 20;
        const maxJumpHeight = isMobile ? (gameContainer.clientHeight * 0.55) : 140;
        let position = currentGroundPos;
        
        let upInterval = setInterval(() => {
            if (position >= maxJumpHeight) {
                clearInterval(upInterval);
                let downInterval = setInterval(() => {
                    if (position <= currentGroundPos) {
                        clearInterval(downInterval);
                        isJumping = false;
                    }
                    position -= isMobile ? 5 : 6;
                    cat.style.bottom = position + 'px';
                }, 15);
            }
            position += isMobile ? 7 : 8;
            cat.style.bottom = position + 'px';
        }, 15);
    }

    function createObstacle() {
        if (!isPlaying) return;
        
        const obs = document.createElement('div');
        obs.className = 'obstacle';
        const obsSkins = ['📦', '🪵', '🐕', '🧱'];
        obs.textContent = obsSkins[Math.floor(Math.random() * obsSkins.length)];
        obs.style.right = '-50px';
        gameContainer.appendChild(obs);
        currentObstacle = obs;

        let obsPosition = gameContainer.clientWidth;
        const currentGroundPos = window.innerWidth <= 768 ? 12 : 20;
        obs.style.bottom = currentGroundPos + 'px';
        
        let moveInterval = setInterval(() => {
            if (!isPlaying) {
                clearInterval(moveInterval);
                return;
            }
            
            obsPosition -= 6 + Math.floor(score / 30);
            obs.style.right = (gameContainer.clientWidth - obsPosition) + 'px';
            obs.style.left = obsPosition + 'px';

            let catRect = cat.getBoundingClientRect();
            let obsRect = obs.getBoundingClientRect();

            if (
                catRect.right > obsRect.left + 10 && 
                catRect.left < obsRect.right - 10 && 
                catRect.bottom > obsRect.top + 10
            ) {
                clearInterval(moveInterval);
                handleGameOver();
            }

            if (obsPosition < -40) {
                clearInterval(moveInterval);
                obs.remove();
                score += 10;
                scoreVal.textContent = score;
            }
        }, 20);

        let nextDelay = Math.random() * (1800 - 900) + 900;
        obstacleTimeout = setTimeout(createObstacle, nextDelay);
    }

    function handleGameOver() {
        isPlaying = false;
        clearTimeout(obstacleTimeout);
        
        setTimeout(() => {
            finalScore.textContent = score;
            endScreen.classList.remove('hidden');
        }, 1000);
    }

    function resetField() {
        score = 0;
        scoreVal.textContent = score;
        if(currentObstacle) currentObstacle.remove();
        document.querySelectorAll('.obstacle').forEach(o => o.remove());
    }

    function startGame() {
        playerName = playerNameInput.value.trim() || "Кот Без Имени";
        startScreen.classList.add('hidden');
        endScreen.classList.add('hidden');
        resetField();
        isPlaying = true;
        createObstacle();
    }

    saveOnlyBtn.addEventListener('click', () => {
        if (score === 0) return;
        saveOnlyBtn.innerText = "ОТПРАВКА...";
        saveOnlyBtn.disabled = true;
        
        const script = document.createElement('script');
        script.id = 'jsonp-leaderboard';
        script.src = SCRIPT_URL + "?callback=renderLeaderboard&name=" + encodeURIComponent(playerName) + "&score=" + score + "&t=" + new Date().getTime();
        document.body.appendChild(script);
        
        setTimeout(() => {
            saveOnlyBtn.innerText = "СОХРАНЕНО";
        }, 500);
    });

    saveAndRestartBtn.addEventListener('click', () => {
        saveAndRestartBtn.innerText = "ОТПРАВКА...";
        saveAndRestartBtn.disabled = true;
        
        if (score > 0) {
            const script = document.createElement('script');
            script.id = 'jsonp-leaderboard';
            script.src = SCRIPT_URL + "?callback=renderLeaderboard&name=" + encodeURIComponent(playerName) + "&score=" + score + "&t=" + new Date().getTime();
            document.body.appendChild(script);
        } else {
            fetchLeaderboard();
        }
        
        setTimeout(() => {
            saveAndRestartBtn.innerText = "ЗАНЕВО";
            saveAndRestartBtn.disabled = false;
            saveOnlyBtn.innerText = "СОХРАНИТЬ";
            saveOnlyBtn.disabled = false;
            
            endScreen.classList.add('hidden');
            resetField();
            isPlaying = true;
            createObstacle();
        }, 800);
    });

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            jump();
        }
    });

    gameContainer.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        e.preventDefault();
        jump();
    });

    startBtn.addEventListener('click', startGame);
</script>
