<style>
    body { background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
    .top-header-block { display: flex; flex-direction: column; align-items: flex-start; padding: 30px 40px 10px 40px; width: 100%; box-sizing: border-box; }
    .breadcrumbs { font-size: 14px; color: #888888; font-weight: 500; margin-top: 10px; text-align: left; }
    .breadcrumbs a { color: #888888; text-decoration: none; }
    .breadcrumbs .current { color: #000000; font-weight: 600; }
    
    main { flex: 1; padding: 20px 40px 120px 40px; display: flex; flex-direction: row; gap: 40px; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; align-items: flex-start; }
    
    .quake-title {
        font-family: 'Press Start 2P', monospace; font-size: 28px; line-height: 1.3; color: #ffffff; text-transform: uppercase; user-select: none; margin: 0 0 10px 0; transform: skewX(-10deg); letter-spacing: -2px; display: inline-block;
        text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #000, -6px 6px 0 #000, -8px 8px 0 #000, -10px 10px 15px rgba(0,0,0,0.3);
    }

    .game-area-wrapper { flex: 2; display: flex; flex-direction: column; width: 100%; }
    
    .game-container {
        width: 100%; height: 300px; border: 4px solid #000000; position: relative; background: #fafafa; overflow: hidden; box-sizing: border-box;
    }

    #cat {
        width: 50px; height: 50px; font-size: 40px; line-height: 50px; text-align: center;
        position: absolute; bottom: 20px; left: 50px; z-index: 2; user-select: none;
    }
    .obstacle {
        width: 40px; height: 40px; font-size: 32px; line-height: 40px; text-align: center;
        position: absolute; bottom: 20px; right: -50px; z-index: 2; user-select: none;
    }
    .ground-line {
        position: absolute; bottom: 20px; left: 0; width: 100%; height: 4px; background: #000000; z-index: 1;
    }

    .game-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.9); z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
    }
    .game-overlay h2 { font-family: 'Press Start 2P', monospace; font-size: 14px; text-transform: uppercase; margin-bottom: 20px; }
    
    .pixel-input {
        font-family: 'Press Start 2P', monospace; font-size: 11px; padding: 10px; border: 4px solid #000000; outline: none; margin-bottom: 20px; width: 80%; max-width: 300px; text-align: center;
    }
    
    .pixel-btn {
        background: #000000; color: #ffffff; border: 4px solid #000000; padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 11px; text-transform: uppercase; cursor: pointer; transition: transform 0.1s;
    }
    .pixel-btn:hover { background: #ffffff; color: #000000; transform: skewX(-5deg); }

    .live-score { font-family: 'Press Start 2P', monospace; font-size: 14px; margin-bottom: 15px; text-align: left; }

    .leaderboard-wrapper { flex: 1; min-width: 280px; border: 4px solid #000000; background: #ffffff; padding: 20px; box-sizing: border-box; }
    .leaderboard-wrapper h2 { font-family: 'Press Start 2P', monospace; font-size: 12px; text-transform: uppercase; margin: 0 0 20px 0; text-align: center; border-bottom: 4px solid #000000; padding-bottom: 10px; }
    
    .leaderboard-list { list-style: none; padding: 0; margin: 0; font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 2; }
    .leaderboard-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #cccccc; padding: 4px 0; }
    .leaderboard-item:last-child { border-bottom: none; }
    .leaderboard-item .rank { color: #888888; margin-right: 5px; }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
        main { flex-direction: column; padding: 10px 20px; }
        .leaderboard-wrapper { width: 100%; min-width: 0; margin-top: 20px; }
    }
</style>
<div class="top-header-block">
    <h1 class="quake-title">котик-бегун</h1>
    <div class="breadcrumbs">
        <a href="../../../">Уютная Лавка Рыжкина</a> — <a href="../../">Входная группа</a> — <a href="../">#котиксвашегодвора</a> — <span class="current">Аркада</span>
    </div>
</div>

<main>
    <div class="game-area-wrapper">
        <div class="live-score">Счёт: <span id="scoreVal">0</span></div>
        
        <div class="game-container" id="gameContainer">
            <div id="cat">🐈</div>
            <div class="ground-line"></div>
            
            <div class="game-overlay" id="startScreen">
                <h2>Регистрация кота-атлета</h2>
                <input type="text" id="playerName" class="pixel-input" placeholder="ИМЯ КОТИКА" maxlength="15">
                <button class="pixel-btn" id="startBtn">СТАРТ</button>
            </div>

            <div class="game-overlay hidden" id="endScreen">
                <h2>БАМС! Препятствие!</h2>
                <p style="font-family:'Press Start 2P'; font-size:11px; margin-bottom:20px;">Ваш счёт: <span id="finalScore">0</span></p>
                <button class="pixel-btn" id="restartBtn">ПОВТОРИТЬ</button>
            </div>
        </div>
        <p style="font-size: 13px; color: #666; margin-top: 10px;">Нажимайте <b>Пробел</b>, <b>Вверх</b> или кликайте по экрану для прыжка.</p>
    </div>

    <div class="leaderboard-wrapper">
        <h2>ТОП-10 КОТОВ</h2>
        <ul class="leaderboard-list" id="leaderboardList">
            <li style="color:#888; text-align:center;">Загрузка рекордов...</li>
        </ul>
    </div>
</main>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0uHScGaAJffoLBj9NQFSr7M7R-diN0pm5UwOX45dX_sbqI0bRdP9TR5jiCHQZDUrqtQ/exec";

    const cat = document.getElementById('cat');
    const gameContainer = document.getElementById('gameContainer');
    const scoreVal = document.getElementById('scoreVal');
    const finalScore = document.getElementById('finalScore');
    
    const startScreen = document.getElementById('startScreen');
    const endScreen = document.getElementById('endScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const playerNameInput = document.getElementById('playerName');
    const leaderboardList = document.getElementById('leaderboardList');

    let score = 0;
    let isJumping = false;
    let isPlaying = false;
    let obstacleTimeout;
    let currentObstacle = null;
    let playerName = "";

    function fetchLeaderboard() {
        const oldScript = document.getElementById('jsonp-leaderboard');
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = 'jsonp-leaderboard';
        script.src = SCRIPT_URL + "?callback=renderLeaderboard&t=" + new Date().getTime();
        
        script.onerror = function() {
            // Если таблица абсолютно пустая, выводим заглушку вместо падения в ошибку
            leaderboardList.innerHTML = `<li style="color:#888; text-align:center;">Пока нет рекордов</li>`;
        };
        document.body.appendChild(script);
    }
    
    fetchLeaderboard();

    window.renderLeaderboard = function(data) {
        leaderboardList.innerHTML = "";
        const list = data.leaderboard;
        
        if (!list || list.length === 0) {
            leaderboardList.innerHTML = `<li style="color:#888; text-align:center;">Никто еще не бегал</li>`;
            return;
        }
        list.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'leaderboard-item';
            li.innerHTML = `<div><span class="rank">#${index+1}</span> ${item[0]}</div><div>${item[1]}</div>`;
            leaderboardList.appendChild(li);
        });
    };

    function submitScore(name, finalScoreVal) {
        // Безопасный кросс-доменный запрос без проверки CORS политик браузера
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name: name, score: finalScoreVal })
        }).then(() => {
            // Запрашиваем обновление ТОП-10 спустя секунду
            setTimeout(fetchLeaderboard, 1200);
        }).catch(err => {
            console.error("Ошибка сети при отправке:", err);
        });
    }

    function jump() {
        if (isJumping || !isPlaying) return;
        isJumping = true;
        let position = 20;
        
        let upInterval = setInterval(() => {
            if (position >= 140) {
                clearInterval(upInterval);
                let downInterval = setInterval(() => {
                    if (position <= 20) {
                        clearInterval(downInterval);
                        isJumping = false;
                    }
                    position -= 6;
                    cat.style.bottom = position + 'px';
                }, 15);
            }
            position += 8;
            cat.style.bottom = position + 'px';
        }, 15);
    }

    function createObstacle() {
        if (!isPlaying) return;
        
        const obs = document.createElement('div');
        obs.className = 'obstacle';
        const obsSkins = ['📦', '🪵', '🐕', '🧱'];
        obs.textContent = obsSkins[Math.floor(Math.random() * obsSkins.length)];
        obs.style.right = '-50px';
        gameContainer.appendChild(obs);
        currentObstacle = obs;

        let obsPosition = gameContainer.clientWidth;
        
        let moveInterval = setInterval(() => {
            if (!isPlaying) {
                clearInterval(moveInterval);
                return;
            }
            
            obsPosition -= 6 + Math.floor(score / 30);
            obs.style.right = (gameContainer.clientWidth - obsPosition) + 'px';
            obs.style.left = obsPosition + 'px';

            let catRect = cat.getBoundingClientRect();
            let obsRect = obs.getBoundingClientRect();

            if (
                catRect.right > obsRect.left + 12 && 
                catRect.left < obsRect.right - 12 && 
                catRect.bottom > obsRect.top + 12
            ) {
                clearInterval(moveInterval);
                handleGameOver();
            }

            if (obsPosition < -40) {
                clearInterval(moveInterval);
                obs.remove();
                score += 10;
                scoreVal.textContent = score;
            }
        }, 20);

        let nextDelay = Math.random() * (1800 - 900) + 900;
        obstacleTimeout = setTimeout(createObstacle, nextDelay);
    }

    function handleGameOver() {
        isPlaying = false;
        clearTimeout(obstacleTimeout);
        
        setTimeout(() => {
            finalScore.textContent = score;
            endScreen.classList.remove('hidden');
            submitScore(playerName, score);
        }, 1000);
    }

    function startGame() {
        playerName = playerNameInput.value.trim() || "Кот Без Имени";
        startScreen.classList.add('hidden');
        endScreen.classList.add('hidden');
        
        score = 0;
        scoreVal.textContent = score;
        if(currentObstacle) currentObstacle.remove();
        document.querySelectorAll('.obstacle').forEach(o => o.remove());
        
        isPlaying = true;
        createObstacle();
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            jump();
        }
    });
    gameContainer.addEventListener('click', jump);

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
</script>
