<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории — Уютная Лавка Рыжкина</title>

    <link rel="icon" type="image/x-icon" href="/favicon.png">
    
    <!-- Исправлено подключение шрифтов Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
        main { flex: 1; display: flex; justify-content: center; align-items: center; text-align: center; padding: 40px; position: relative; }
        .categories-menu { display: flex; flex-direction: column; gap: 40px; align-items: center; }
        .menu-link { text-decoration: none; display: inline-block; }
        
        /* Рамки и исходная анимация блоков полностью сохранены */
        .frame-wrapper { padding: 25px 50px; min-width: 400px; background: #ffffff; border: 4px solid #000000; box-shadow: 0 0 0 4px #ffffff, 0 20px 40px rgba(0,0,0,0.08); border-radius: 2px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .menu-link:hover .frame-wrapper { transform: scale(1.02) skewX(-10deg); box-shadow: 0 0 0 4px #ffffff, 0 25px 50px rgba(0,0,0,0.15); }
        
        /* ИСПРАВЛЕНО: Текст внутри рамок теперь имеет точный стиль и анимацию из «Кулинарии» */
        .quake-title {
            font-family: 'Press Start 2P', monospace; font-size: 36px; line-height: 1.3; color: #ffffff; text-transform: uppercase; user-select: none; margin: 0; transform: skewX(-10deg); letter-spacing: -2px; display: inline-block;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -3px 3px 0 #000, -4px 4px 0 #000, -5px 5px 0 #000, -6px 6px 0 #000, -7px 7px 0 #000, -8px 8px 0 #000, -9px 9px 0 #000, -10px 10px 15px rgba(0,0,0,0.4);
            animation: quakePulse 2s infinite ease-in-out;
        }
        @keyframes quakePulse {
            0%, 100% { color: #ffffff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #000, -6px 6px 0 #000, -8px 8px 0 #000, -10px 10px 15px rgba(0,0,0,0.3); }
            50% { color: #e5e5e5; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -5px 5px 0 #333, -8px 8px 0 #111, -11px 11px 20px rgba(0,0,0,0.5); }
        }
        
        .back-btn { position: absolute; bottom: 30px; left: 30px; margin: 0; padding: 10px; color: #000000; text-decoration: none; font-size: 14px; font-weight: 500; opacity: 0.5; transition: opacity 0.2s ease; }
        .back-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <main>
        <div class="categories-menu">
            <!-- Ссылки ведут на сквозные латинские пути без index.html -->
            <a href="/vhodnaya-gruppa/kulinariya/" class="menu-link">
                <div class="frame-wrapper">
                    <h2 class="quake-title">Кулинария</h2>
                </div>
            </a>
            <a href="/vhodnaya-gruppa/alkogol/" class="menu-link">
                <div class="frame-wrapper">
                    <h2 class="quake-title">Алкоголь</h2>
                </div>
            </a>
            <a href="/vhodnaya-gruppa/gonzo/" class="menu-link">
                <div class="frame-wrapper">
                    <h2 class="quake-title">Gonzo</h2>
                </div>
            </a>
        </div>
        <!-- Идеально чистый возврат в самый корень сайта -->
        <a href="/" class="back-btn">← вернуться на порог Уютной Лавки Рыжкина</a>
    </main>
</body>
</html>
