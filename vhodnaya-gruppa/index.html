<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Входная группа — Уютная Лавка Рыжкина</title>
    <meta name="description" content="Разделы Уютной Лавки Рыжкина: #котиксвашегодвора, кулинария, культура алкоголя и gonzo-репортажи.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #ffffff; 
            color: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            -webkit-font-smoothing: antialiased; 
        }
        .top-header-block { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            padding: 30px 40px 10px 40px; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .breadcrumbs { font-size: 14px; color: #888888; font-weight: 500; margin-top: 10px; }
        .breadcrumbs a { color: #888888; text-decoration: none; transition: color 0.2s; }
        .breadcrumbs a:hover { color: #000000; }
        .breadcrumbs .current { color: #000000; font-weight: 600; }
        main { 
            flex: 1; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-sizing: border-box; 
            width: 100%; 
        }
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(2, minmax(280px, 340px)); 
            gap: 40px; 
            justify-content: center; 
            align-items: center; 
            max-width: 800px; 
            width: 100%; 
        }
        .signboard-holder {
            display: inline-block;
            transform-origin: top center;
            animation: windSway 4s infinite ease-in-out;
        }
        .signboard-holder:nth-child(even) {
            animation-delay: -2s;
        }
        @keyframes windSway {
            0%, 100% { transform: rotate(1.2deg); }
            50% { transform: rotate(-1.2deg); }
        }
        .menu-link { text-decoration: none; display: inline-block; width: 100%; }
        .frame-wrapper { 
            padding: 25px 20px; 
            background: #ffffff; 
            border: 5px solid #000000; 
            box-shadow: 0 0 0 5px #ffffff, 0 15px 30px rgba(0,0,0,0.06); 
            border-radius: 2px; 
            transition: transform 0.2s ease, box-shadow 0.2s ease; 
            box-sizing: border-box; 
            text-align: center;
        }
        .menu-link:hover .frame-wrapper { 
            transform: scale(1.02) skewX(-10deg); 
            box-shadow: 0 0 0 5px #ffffff, 0 20px 40px rgba(0,0,0,0.12); 
        }
        .quake-title {
            font-family: 'Press Start 2P', monospace; 
            font-size: 18px; 
            line-height: 1.3; 
            color: #ffffff; 
            text-transform: uppercase; 
            user-select: none; 
            margin: 0; 
            transform: skewX(-10deg); 
            letter-spacing: -1px; 
            display: inline-block;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -3px 3px 0 #000, -4px 4px 0 #000, -5px 5px 0 #333, -6px 6px 0 #111, -7px 7px 10px rgba(0,0,0,0.4);
            animation: quakePulse 2s infinite ease-in-out;
        }
        .signboard-holder:nth-child(2) .quake-title { animation-delay: -0.5s; }
        .signboard-holder:nth-child(3) .quake-title { animation-delay: -1s; }
        .signboard-holder:nth-child(4) .quake-title { animation-delay: -1.5s; }
        @keyframes quakePulse {
            0%, 100% { color: #ffffff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #000, -6px 6px 0 #000, -8px 8px 0 #000, -10px 10px 10px rgba(0,0,0,0.3); }
            50% { color: #e5e5e5; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #333, -6px 6px 0 #111, -8px 8px 12px rgba(0,0,0,0.5); }
        }
        .back-btn { position: fixed; bottom: 10px; left: 10px; margin: 0; padding: 10px; color: #000000; text-decoration: none; font-size: 14px; font-weight: 500; opacity: 0.5; transition: opacity 0.2s ease; z-index: 20; background: rgba(255,255,255,0.9); border-radius: 4px; }
        .back-btn:hover { opacity: 1; }
        @media (max-width: 768px) {
            .top-header-block { align-items: center; text-align: center; padding: 20px; }
            .breadcrumbs { text-align: center; font-size: 13px; }
            main { padding: 20px; }
            .menu-grid { grid-template-columns: 1fr; gap: 25px; }
            .frame-wrapper { padding: 20px 15px; }
            .quake-title { font-size: 14px; }
            .back-btn { width: calc(100% - 40px); left: 10px; right: 10px; text-align: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        }
    </style>
</head>
<body>
    <div class="top-header-block">
        <div class="breadcrumbs">
            <a href="../">Уютная Лавка Рыжкина</a> — <span class="current">Входная группа</span>
        </div>
    </div>
    <main>
        <div class="menu-grid">
            <div class="signboard-holder">
                <a href="kulinariya/" class="menu-link">
                    <div class="frame-wrapper">
                        <h2 class="quake-title">Кулинария</h2>
                    </div>
                </a>
            </div>
            <div class="signboard-holder">
                <a href="alkogol/" class="menu-link">
                    <div class="frame-wrapper">
                        <h2 class="quake-title">Алкоголь</h2>
                    </div>
                </a>
            </div>
            <div class="signboard-holder">
                <a href="kotiki/" class="menu-link">
                    <div class="frame-wrapper">
                        <h2 class="quake-title">#котики</h2>
                    </div>
                </a>
            </div>
            <div class="signboard-holder">
                <a href="gonzo/" class="menu-link">
                    <div class="frame-wrapper">
                        <h2 class="quake-title">Gonzo</h2>
                    </div>
                </a>
            </div>
        </div>
        <a href="../" class="back-btn">← На Главную страницу</a>
    </main>
    <script src="/cookie.js"></script>
</body>
</html>
