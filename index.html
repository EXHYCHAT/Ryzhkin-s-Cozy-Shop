    <style>
        body { 
            background: #ffffff; 
            color: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased; 
        }
        .top-nav {
            display: flex;
            justify-content: flex-end;
            padding: 30px 40px;
            gap: 20px;
            box-sizing: border-box;
        }
        .nav-link {
            font-size: 14px;
            color: #888888;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s, font-weight 0.2s;
        }
        .nav-link:hover {
            color: #000000;
            font-weight: 600;
        }
        main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 40px; 
            box-sizing: border-box;
            margin-top: -60px;
        }
        .signboard-holder {
            display: inline-block;
            transform-origin: top center;
            animation: windSway 4s infinite ease-in-out;
        }
        @keyframes windSway {
            0%, 100% { transform: rotate(1.5deg); }
            50% { transform: rotate(-1.5deg); }
        }
        .landing-link { text-decoration: none; display: inline-block; max-width: 100%; }
        .frame-wrapper { 
            padding: 25px 45px; 
            background: #ffffff; 
            border: 5px solid #000000; 
            box-shadow: 0 0 0 5px #ffffff, 0 25px 50px rgba(0,0,0,0.08); 
            border-radius: 2px; 
            transition: transform 0.2s ease, box-shadow 0.2s ease; 
            box-sizing: border-box; 
        }
        .landing-link:hover .frame-wrapper { 
            transform: scale(1.02) skewX(-10deg); 
            box-shadow: 0 0 0 5px #ffffff, 0 30px 60px rgba(0,0,0,0.15); 
        }
        .quake-title {
            font-family: 'Press Start 2P', monospace; 
            font-size: 38px; 
            line-height: 1.3; 
            color: #ffffff; 
            text-transform: uppercase; 
            user-select: none; 
            margin: 0; 
            transform: skewX(-10deg); 
            letter-spacing: -2px; 
            display: inline-block;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -3px 3px 0 #000, -4px 4px 0 #000, -5px 5px 0 #333, -6px 6px 0 #111, -7px 7px 15px rgba(0,0,0,0.4);
            animation: quakePulse 2s infinite ease-in-out;
        }
        @keyframes quakePulse {
            0%, 100% { color: #ffffff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -4px 4px 0 #000, -6px 6px 0 #000, -8px 8px 0 #000, -10px 10px 15px rgba(0,0,0,0.3); }
            50% { color: #e5e5e5; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 2px 0 #000, -5px 5px 0 #333, -8px 8px 0 #111, -11px 11px 20px rgba(0,0,0,0.5); }
        }
        .microdata { display: none; }
        @media (max-width: 768px) {
            .top-nav { justify-content: center; padding: 20px; gap: 15px; }
            .nav-link { font-size: 13px; }
            main { padding: 20px; margin-top: -40px; }
            .frame-wrapper { padding: 20px 25px; border-width: 4px; }
            .quake-title { font-size: 20px; letter-spacing: -1px; }
