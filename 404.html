<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница не найдена — 404</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 { font-size: 50px; margin-bottom: 10px; }
        p { font-size: 20px; color: #666; }
        a { color: #0076ff; text-decoration: none; font-weight: bold; }
        a:hover { text-underline-position: under; text-decoration: underline; }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Упс! Страница, которую вы ищете, не существует или переехала.</p>
    <p><a href="/">Вернуться на главную страницу</a></p>
</body>
</html>
